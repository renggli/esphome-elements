- type: caustics_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.35
        color: "#000000" # black
      - type: gradient
        from: "#001020" # dark blue
        to: "#00E5FF" # cyan
- type: clockwork_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.15
        color: "#000000" # black
      - type: gradient
        from: "#FF3D00" # polished copper
        to: "#FFD700" # antique brass
      - type: gradient
        from: "#FFD700" # antique brass
        to: "#00E5FF" # tempered steel cyan
      - type: gradient
        from: "#00E5FF" # tempered steel cyan
        to: "#E040FB" # jewel ruby
- type: frizzle_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.35
        color: "#000000" # black
      - type: gradient
        from: "#304FFE" # indigo
        to: "#00E5FF" # cyan
- type: spectral_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.35
        color: "#000000" # black
      - type: gradient
        from: "#1A237E" # navy
        to: "#E040FB" # purple
- type: splatter_animation
  color_scheme:
    type: rainbow
- type: blackhole_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.15
        color: "#000000" # black
      - type: gradient
        from: "#000000" # black
        to: "#D50000" # red
        fraction: 0.35
      - type: gradient
        from: "#D50000" # red
        to: "#FFD600" # yellow
        fraction: 0.50



