# All supported animation types.
- type: meatballs_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        color: "#000000"
      - type: triadic
        color: "#FF5722"
- type: plasma_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.25
        color: "#000000"
      - type: complementary
        color: "#9C27B0"
        sweep: 60.0
      - type: static
        fraction: 0.25
        color: "#000000"
- type: ripples_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.15
        color: "#000000" # black base
      - type: gradient
        from: "#000000" # black
        to: "#00E5FF" # cyan (R=0 avoids white sparkles)
- type: spiral_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.25
        color: "#000000"
      - type: triadic
        color: "#FFEB3B"
- type: voronoi_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        color: "#000000"
      - type: triadic
        color: "#E91E63"
- type: interference_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.25
        color: "#000000" # black
      - type: complementary
        color: "#E040FB" # neon violet
        sweep: 45.0
- type: julia_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        color: "#000000"
      - type: complementary
        color: "#ff0000"
- type: matrix_animation
  color_scheme:
    type: monochromatic
    color: "#00FF00" # pure green
    min_brightness: 0.0
- type: fire_animation
  color_scheme:
    type: sequence
    schemes:
      - type: gradient
        from: "#000000" # black
        to: "#A00000" # deep red
        fraction: 0.1
      - type: gradient
        from: "#A00000" # deep red
        to: "#FF6000" # orange
        fraction: 0.2
      - type: gradient
        from: "#FF6000" # orange
        to: "#FFF000" # yellow
        fraction: 0.7
- type: tunnel_animation
  color_scheme:
    type: triadic
    color: "#AA00FF"
- type: wave_animation
  color_scheme:
    type: sequence
    schemes:
      - type: static
        fraction: 0.2
        color: "#000000" # black
      - type: gradient
        from: "#0D47A1" # navy
        to: "#00E5FF" # cyan
      - type: gradient
        from: "#00E5FF" # cyan
        to: "#E0F7FA" # foam white
- type: stars_animation
  color_scheme:
    type: gradient
    from: "#000000"
    to: "#90CAF9"
- type: lorenz_animation
  color_scheme:
    type: monochromatic
    color: "#90CAF9"
